name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            # ── Pre-flight: verify first-time setup has been done ───────────
            if [ ! -d /opt/server-iq ]; then
              echo ""
              echo "ERROR: /opt/server-iq does not exist."
              echo "Run setup.sh on the VPS first (once, as root):"
              echo ""
              echo "  sudo bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/exzellenzschmiede/server.iq/main/setup.sh)\""
              echo ""
              echo "Then edit /opt/server-iq/.env and start the service:"
              echo "  sudo nano /opt/server-iq/.env"
              echo "  sudo systemctl start server-iq"
              echo "  sudo systemctl reload nginx"
              exit 1
            fi

            # ── Pull latest code ────────────────────────────────────────────
            cd /opt/server-iq
            git pull origin main

            # ── Backend: install deps + restart service ─────────────────────
            cd /opt/server-iq/backend
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart server-iq

            # ── Frontend: build ─────────────────────────────────────────────
            cd /opt/server-iq/frontend
            npm ci --silent
            npm run build

            # ── nginx: deploy config + reload ───────────────────────────────
            sudo cp /opt/server-iq/nginx/server-iq.conf \
              /etc/nginx/sites-available/server-iq.conf
            sudo ln -sf /etc/nginx/sites-available/server-iq.conf \
              /etc/nginx/sites-enabled/server-iq.conf
            sudo nginx -t && sudo systemctl reload nginx

            echo "Deployment complete"
