name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GIT_TOKEN
          command_timeout: 15m
          script: |
            set -e

            # ── Pre-flight: verify first-time setup has been done ───────────
            if [ ! -d /opt/server-iq ]; then
              echo ""
              echo "ERROR: /opt/server-iq does not exist."
              echo "Run setup.sh on the VPS first (once, as root):"
              echo "  git clone https://github.com/exzellenzschmiede/server.iq /opt/server-iq"
              echo "  sudo bash /opt/server-iq/setup.sh"
              exit 1
            fi

            # ── Pull latest code (private repo via ephemeral Actions token) ──
            cd /opt/server-iq
            git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/exzellenzschmiede/server.iq.git"
            git pull origin main
            git remote set-url origin "https://github.com/exzellenzschmiede/server.iq.git"

            # ── Backend: install deps + reload service unit + restart ───────
            cd /opt/server-iq/backend
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            sudo cp /opt/server-iq/server-iq.service /etc/systemd/system/server-iq.service
            sudo systemctl daemon-reload
            sudo systemctl restart server-iq

            # ── Frontend: build ─────────────────────────────────────────────
            cd /opt/server-iq/frontend
            npm ci --silent
            npm run build

            # ── nginx: deploy config + reload ───────────────────────────────
            sudo cp /opt/server-iq/nginx/server-iq.conf \
              /etc/nginx/sites-available/server-iq.conf
            sudo ln -sf /etc/nginx/sites-available/server-iq.conf \
              /etc/nginx/sites-enabled/server-iq.conf
            sudo nginx -t && sudo systemctl reload nginx

            echo "Deployment complete"
