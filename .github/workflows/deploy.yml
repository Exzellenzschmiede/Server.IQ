name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            # ── One-time: remove old Docker containers if still running ─────
            docker ps -a --filter "name=server-iq" --format "{{.ID}}" \
              | xargs -r docker rm -f 2>/dev/null || true
            docker images --filter "reference=ghcr.io/exzellenzschmiede/server.iq*" \
              --format "{{.ID}}" | xargs -r docker rmi -f 2>/dev/null || true

            # ── Pull latest code ────────────────────────────────────────────
            cd /opt/server-iq
            git pull origin main

            # ── Backend: install deps + restart service ─────────────────────
            cd /opt/server-iq/backend
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart server-iq

            # ── Frontend: build ─────────────────────────────────────────────
            cd /opt/server-iq/frontend
            npm ci --silent
            npm run build

            # ── nginx: deploy config + reload ───────────────────────────────
            sudo cp /opt/server-iq/nginx/server-iq.conf \
              /etc/nginx/sites-available/server-iq.conf
            sudo ln -sf /etc/nginx/sites-available/server-iq.conf \
              /etc/nginx/sites-enabled/server-iq.conf
            sudo nginx -t && sudo systemctl reload nginx

            echo "Deployment complete"
