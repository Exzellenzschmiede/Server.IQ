# Deploy to /etc/nginx/sites-available/server-iq.conf on VPS
# Then: ln -s /etc/nginx/sites-available/server-iq.conf /etc/nginx/sites-enabled/
# And:  nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name server.exzellenzschmiede.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name server.exzellenzschmiede.de;

    # Adjust paths to your existing Let's Encrypt certs
    ssl_certificate     /etc/letsencrypt/live/server.exzellenzschmiede.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.exzellenzschmiede.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API (REST + WebSocket)
    location /api/ {
        proxy_pass         http://127.0.0.1:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend
    location / {
        proxy_pass       http://127.0.0.1:${FRONTEND_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
