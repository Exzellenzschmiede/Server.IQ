services:
  backend:
    image: ghcr.io/exzellenzschmiede/server.iq-backend:latest
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/exzellenzschmiede/server.iq-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8101}:80"
    networks:
      - internal
    depends_on:
      - backend

networks:
  internal:
    driver: bridge
